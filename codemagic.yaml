workflows:
  ios_unsigned:
    name: ImageMagick iOS - unsigned
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: "26.5"
      vars:
        XCODE_PROJECT: "ImageMagickApp/ImageMagickApp.xcodeproj"
        XCODE_SCHEME: "ImageMagickApp"
        BUNDLE_ID: "com.zedikas.imagemagick"
    scripts:
      - name: Build ImageMagick static libraries
        script: |
          chmod +x scripts/build_imagemagick_ios.sh
          IM_VERSION="main" ./scripts/build_imagemagick_ios.sh
      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  ios_release:
    name: ImageMagick iOS - signed IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: "26.5"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zedikas.imagemagick
      vars:
        XCODE_PROJECT: "ImageMagickApp/ImageMagickApp.xcodeproj"
        XCODE_SCHEME: "ImageMagickApp"
        BUNDLE_ID: "com.zedikas.imagemagick"
    scripts:
      - name: Build ImageMagick static libraries
        script: |
          chmod +x scripts/build_imagemagick_ios.sh
          IM_VERSION="main" ./scripts/build_imagemagick_ios.sh
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
